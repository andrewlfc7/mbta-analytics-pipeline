x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'

    # === RESOURCE LIMITS ===
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: '1'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '60'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '60'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    AIRFLOW__WEBSERVER__WORKERS: '1'
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '300'

    # === App Config ===
    MBTA_ENV: gcp
    MBTA_API_KEY: ${MBTA_API_KEY}
    GCP_PROJECT_ID: server-i3
    GCS_BUCKET: mbta-raw-prod
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/mbta-sa-key.json
    PYTHONPATH: /opt/airflow
    DBT_PROFILES_DIR: /opt/airflow/dbt_mbta
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./dbt_mbta:/opt/airflow/dbt_mbta
    - ./great_expectations:/opt/airflow/great_expectations
    - ./.env:/opt/airflow/.env
    - /home/Drew/mbta-sa-key.json:/opt/airflow/keys/mbta-sa-key.json:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Fix dbt directory permissions for airflow user
        mkdir -p /opt/airflow/dbt_mbta/logs /opt/airflow/dbt_mbta/target /opt/airflow/dbt_mbta/dbt_packages
        chmod -R 777 /opt/airflow/dbt_mbta/logs /opt/airflow/dbt_mbta/target /opt/airflow/dbt_mbta/dbt_packages
        # Fix data directory
        mkdir -p /opt/airflow/data/raw
        chmod -R 777 /opt/airflow/data
        # Run migrations
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: always

volumes:
  postgres-data:
  airflow-logs:
