x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW_UID: 1001
    AIRFLOW_GID: 0
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
    MBTA_ENV: gcp
    MBTA_API_KEY: ${MBTA_API_KEY}
    GCP_PROJECT_ID: server-i3
    GCS_BUCKET: mbta-raw-prod
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/mbta-sa-key.json
    PYTHONPATH: /opt/airflow
    DBT_PROFILES_DIR: /opt/airflow/dbt_mbta
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./dbt_mbta:/opt/airflow/dbt_mbta
    - ./great_expectations:/opt/airflow/great_expectations
    - ./.env:/opt/airflow/.env
    - /home/Drew/mbta-sa-key.json:/opt/airflow/keys/mbta-sa-key.json:ro
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  airflow-init:
    <<: *airflow-common
    user: "1001:0"
    command:
      - bash
      - -lc
      - |
        set -e

        echo "=== Fixing ALL directory permissions ==="

        mkdir -p /opt/airflow/logs/scheduler /opt/airflow/logs/dag_processor_manager
        chown -R 1001:0 /opt/airflow/logs
        chmod -R 775 /opt/airflow/logs
        find /opt/airflow/logs -type d -exec chmod 2775 {} +

        mkdir -p /opt/airflow/dbt_mbta/logs /opt/airflow/dbt_mbta/target /opt/airflow/dbt_mbta/dbt_packages
        chown -R 1001:0 /opt/airflow/dbt_mbta
        chmod -R 775 /opt/airflow/dbt_mbta

        mkdir -p /opt/airflow/data/raw
        chown -R 1001:0 /opt/airflow/data
        chmod -R 775 /opt/airflow/data

        echo "=== Permissions ==="
        ls -lan /opt/airflow/logs/

        airflow db migrate

        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true

        echo "=== Init complete ==="
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

  airflow-webserver:
    <<: *airflow-common
    user: "1001:0"
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M

  airflow-scheduler:
    <<: *airflow-common
    user: "1001:0"
    command:
      - bash
      - -lc
      - |
        set -e

        echo "=== Scheduler pre-flight ==="
        TODAY=$$(date -u +%Y-%m-%d)

        mkdir -p "/opt/airflow/logs/scheduler/$$TODAY"
        chmod 2775 "/opt/airflow/logs/scheduler/$$TODAY" 2>/dev/null || true

        mkdir -p /tmp/dbt_logs /tmp/dbt_target
        chmod 775 /tmp/dbt_logs /tmp/dbt_target 2>/dev/null || true

        echo "=== Runtime identity ==="
        id
        getent passwd "$(id -u)" || true

        echo "=== Scheduler log dir ==="
        ls -lan /opt/airflow/logs/scheduler/ || true
        ls -lan "/opt/airflow/logs/scheduler/$$TODAY/" || true

        echo "=== Starting scheduler ==="
        exec airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    restart: always
    deploy:
      resources:
        limits:
          memory: 2048M

volumes:
  postgres-data:
