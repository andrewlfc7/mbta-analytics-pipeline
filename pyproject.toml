[project]
name = "mbta-analytics-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "httpx",
    "polars",
    "pyarrow",
    "duckdb",
    "apache-airflow",
    "dbt-duckdb",
    "dbt-bigquery",
    "great-expectations",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "python-dotenv",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "jupyter",
    "plotly",
    "folium",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "seaborn",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
