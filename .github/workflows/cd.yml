name: CD

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests before deploy
        run: |
          pip install httpx polars pyarrow duckdb python-dotenv structlog pytest
          pytest tests/test_ingestion.py tests/test_extractors.py tests/test_loaders.py -v

      - name: Validate deploy secrets
        run: |
          [ -n "${{ secrets.GCP_VM_HOST }}" ] || (echo "Missing GCP_VM_HOST" && exit 1)
          [ -n "${{ secrets.GCP_VM_USER }}" ] || (echo "Missing GCP_VM_USER" && exit 1)
          [ -n "${{ secrets.GCP_VM_SSH_KEY_B64 }}" ] || (echo "Missing GCP_VM_SSH_KEY_B64" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} "echo connected"

      - name: Deploy on VM
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} << 'EOF'
            set -e
            cd ~/mbta-analytics-pipeline
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
          EOF