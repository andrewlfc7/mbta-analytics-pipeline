name: CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests before deploy
        run: |
          pip install httpx polars pyarrow duckdb python-dotenv structlog pytest
          pytest tests/test_ingestion.py tests/test_extractors.py tests/test_loaders.py -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"


      - name: Deploy on VM with gcloud ssh
        run: |
          gcloud compute ssh "${{ secrets.GCP_INSTANCE_NAME }}" \
            --zone "${{ secrets.GCP_ZONE }}" \
            --command "\
              git config --global --add safe.directory /opt/mbta-analytics-pipeline && \
              cd /opt/mbta-analytics-pipeline && \
              cp .env /tmp/.env.backup 2>/dev/null || true && \
              git fetch origin && \
              git reset --hard origin/master && \
              cp /tmp/.env.backup .env 2>/dev/null || true && \
              sudo docker compose up -d --build && \
              sudo docker image prune -f"